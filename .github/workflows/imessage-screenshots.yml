name: iMessage screenshots -> App Store Connect

# Uploads branding/store-screenshots/imessage-* to the editable iOS version.
#
# Runs here rather than on the dev Mac because the ASC issuer id is a repo secret and
# belongs in exactly one place. The screenshots themselves are committed, generated by
# tools/capture-imessage-screenshots.sh.

on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'Clear each set before uploading (otherwise a non-empty set is skipped)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      dry_run:
        description: 'List what would upload, change nothing'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      create_version:
        description: 'Open this App Store version if none is editable (e.g. 1.7.0); blank to require one'
        required: false
        default: ''
        type: string
      list_only:
        description: 'Just print the app iOS versions and stop'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: imessage-screenshots
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyjwt cryptography

      # The secret is base64, exactly as appstore-build.yml treats it. Passing it
      # through raw fails with "Unable to load PEM file ... MalformedFraming".
      - name: Install the ASC API key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${KID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KID}.p8

      - name: Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ "${{ inputs.list_only }}" = "true" ]; then
            python3 tools/asc_screenshots.py --list
            exit 0
          fi
          ARGS=""
          [ "${{ inputs.replace }}" = "true" ] && ARGS="$ARGS --replace"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ inputs.create_version }}" ] && ARGS="$ARGS --create-version ${{ inputs.create_version }}"
          python3 tools/asc_screenshots.py $ARGS \
            --set IMESSAGE_APP_IPHONE_67=branding/store-screenshots/imessage-iphone-6.9 \
            --set IMESSAGE_APP_IPAD_PRO_3GEN_129=branding/store-screenshots/imessage-ipad-13
