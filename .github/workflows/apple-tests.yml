name: Apple Core tests

# The Apple side had no test target at all while Windows carried 443 tests, so
# Core regressions could only be caught by driving a simulator by hand. These are
# pure-logic tests over the platform-agnostic Core — macOS-only, no simulator
# boot, no app install — so the whole suite runs in seconds on every push.
on:
  push:
    paths:
      - 'TidbitsTrivia/Core/**'
      - 'TidbitsTriviaTests/**'
      - 'project.yml'
      # LiveEventFileGoldenTests round-trips this file from the repo, so a change
      # to it must trigger the suite that checks it.
      - 'tools/live-event/**'
      - '.github/workflows/apple-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macos-15 ships Xcode 16.4, whose macOS SDK is 15.x — and this project's
    # deployment target is macOS 26 (the iOS 26 / macOS 26 / tvOS 26 baseline).
    # xcodebuild refused every run for days with "My Mac's macOS 15.7.7 doesn't
    # match TidbitsTriviaTests's macOS 26.0 deployment target". appstore-build.yml
    # already ran on macos-26 and selected Xcode explicitly; this workflow never
    # got the same treatment.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] || { echo "no Xcode 26 on this image"; ls -d /Applications/Xcode*.app; exit 1; }
          echo "Selected Xcode: $XC"
          sudo xcode-select -s "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          "$XC/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The pbxproj is generated, never hand-edited (the macOS config-clobber
      # ratchet) — so CI regenerates it rather than trusting the committed copy.
      - name: Generate the project
        run: xcodegen generate

      - name: Run Core tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project TidbitsTrivia.xcodeproj \
            -scheme TidbitsTrivia \
            -destination 'platform=macOS' \
            -only-testing:TidbitsTriviaTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild test \
            -project TidbitsTrivia.xcodeproj \
            -scheme TidbitsTrivia \
            -destination 'platform=macOS' \
            -only-testing:TidbitsTriviaTests \
            CODE_SIGNING_ALLOWED=NO
