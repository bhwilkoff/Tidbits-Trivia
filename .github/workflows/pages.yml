# GitHub Pages deploy for the web app. Replaces the built-in "deploy from a branch"
# flow, which has NO concurrency control — rapid pushes created overlapping deployments
# and GitHub failed some with "Deployment failed, try again later." The `concurrency`
# group serializes deploys (one at a time; intermediate queued runs are skipped, the
# in-progress one is allowed to finish), which fixes the intermittent failures.
#
# The site is the repo root as-is (a vanilla static site; .nojekyll bypasses Jekyll,
# CNAME preserves the custom domain) — identical content to the legacy branch deploy.
name: Deploy web to Pages

on:
  push:
    branches: [main]
    # Only redeploy when WEB files change. GitHub Pages soft-limits deployments
    # (~10/hr) — without this, every Swift/Kotlin/docs commit triggered a needless
    # web deploy and we hit the limit ("Deployment failed, try again later").
    paths:
      - 'index.html'
      - '404.html'
      - 'privacy.html'
      - 'terms.html'
      - 'support.html'
      - 'manifest.json'
      - 'sw.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'CNAME'
      - '.nojekyll'
      # .well-known IS copied by the staging step below, but it was never a TRIGGER —
      # so an assetlinks/AASA change on its own deployed nothing and looked like the
      # file simply didn't work.
      - '.well-known/**'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'branding/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage web files only
        run: |
          mkdir -p _site
          for item in index.html 404.html privacy.html terms.html support.html manifest.json sw.js \
                      robots.txt sitemap.xml CNAME .nojekyll css js assets branding data \
                      .well-known; do
            [ -e "$item" ] && cp -r "$item" _site/
          done
          test -f _site/index.html   # fail loudly if the site root is missing
          echo "Staged $(du -sh _site | cut -f1) across $(find _site -type f | wc -l | tr -d ' ') files"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      # The Pages deployment API intermittently returns "Deployment failed, try again
      # later" when a deploy lands close to a prior one (rate/concurrency). That is a
      # TRANSIENT reject, not a build error — so retry up to 3× with backoff instead of
      # letting one flake turn the whole build red. cancel-in-progress stays false so a
      # deploy is never cancelled mid-flight (which can wedge the next one).
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deploy (attempt 2)
        if: steps.deployment.outcome == 'failure'
        run: echo "Deploy attempt 1 failed (transient) — waiting 60s before retry…" && sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deploy (attempt 3)
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: echo "Deploy attempt 2 failed (transient) — waiting 120s before final retry…" && sleep 120
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # If all three attempts failed, fail the job loudly (a real, non-transient problem).
      - name: Confirm a deploy succeeded
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ] || \
             [ "${{ steps.deployment2.outcome }}" = "success" ] || \
             [ "${{ steps.deployment3.outcome }}" = "success" ]; then
            echo "Pages deploy succeeded."
          else
            echo "::error::All 3 Pages deploy attempts failed — not a transient flake."
            exit 1
          fi
