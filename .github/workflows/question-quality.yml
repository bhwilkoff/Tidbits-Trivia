name: Question quality gate

# Every content fix in the 2026-08-01 play-audit session was REACTIVE: play the
# game, notice a bad question, fix that instance. That is unbounded work, because
# nothing stopped the next one appearing — "Cædmon's Hymn -> Cædmon", "In what
# year was Auschwitz founded or created?", a Business round with no business in
# it, all shipped and all were found by looking rather than by any check.
#
# This is the check. It fails the build on a question that should never ship, and
# it reads the DATA rather than a sample of gameplay, so nothing slips through by
# not being drawn during a sweep. It also asserts the three platform copies are
# byte-identical — they silently drifted once, and the app, the tests and 126
# playthroughs all stayed green because each was reading a different one.
on:
  push:
    paths:
      - 'assets/**'
      - 'TidbitsTrivia/Resources/*.json'
      - 'android/app/src/main/assets/*.json'
      - 'tools/corpus/**'
      - '.github/workflows/question-quality.yml'
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every platform ships the same questions
        run: python3 tools/corpus/check_mirrors.py

      - name: No question that should never ship
        run: python3 tools/corpus/quality_gate.py
