name: iMessage screenshots -> App Store Connect

# Uploads branding/store-screenshots/imessage-* to the editable iOS version, and
# carries the rest of the ship: attach a build, set release notes, submit for review.
#
# Runs here rather than on the dev Mac because the ASC issuer id is a repo secret and
# belongs in exactly one place. The screenshots themselves are committed, generated by
# tools/capture-imessage-screenshots.sh.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        default: 'status'
        type: choice
        options: [status, audit, list, upload, dry-run]
      replace:
        description: 'On upload: clear each set first (otherwise a non-empty set is skipped)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      create_version:
        description: 'Open this App Store version if none is editable (e.g. 1.7.0)'
        required: false
        default: ''
        type: string
      attach_build:
        description: 'Attach this build number (e.g. 123)'
        required: false
        default: ''
        type: string
      release_notes:
        description: "What's New text"
        required: false
        default: ''
        type: string
      release_type:
        description: 'How it goes live once approved'
        required: false
        default: ''
        type: choice
        options: ['', 'AFTER_APPROVAL', 'MANUAL']
      submit:
        description: 'Submit for App Review (withdrawable in Connect afterwards)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: imessage-screenshots
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyjwt cryptography

      # The secret is base64, exactly as appstore-build.yml treats it. Passing it
      # through raw fails with "Unable to load PEM file ... MalformedFraming".
      - name: Install the ASC API key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${KID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KID}.p8

      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MODE: ${{ inputs.mode }}
          REPLACE: ${{ inputs.replace }}
          CREATE_VERSION: ${{ inputs.create_version }}
          ATTACH_BUILD: ${{ inputs.attach_build }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          SETS=(--set IMESSAGE_APP_IPHONE_67=branding/store-screenshots/imessage-iphone-6.9
                --set IMESSAGE_APP_IPAD_PRO_3GEN_129=branding/store-screenshots/imessage-ipad-13)

          if [ "$MODE" = "list" ]; then
            exec python3 tools/asc_screenshots.py --list
          fi

          ARGS=()
          if [ -n "$CREATE_VERSION" ]; then ARGS+=(--create-version "$CREATE_VERSION"); fi
          if [ -n "$ATTACH_BUILD" ];   then ARGS+=(--attach-build "$ATTACH_BUILD"); fi
          if [ -n "$RELEASE_NOTES" ];  then ARGS+=(--release-notes "$RELEASE_NOTES"); fi
          if [ -n "$RELEASE_TYPE" ];   then ARGS+=(--release-type "$RELEASE_TYPE"); fi

          case "$MODE" in
            status)  ARGS+=(--status) ;;
            audit)   ARGS+=(--audit) ;;
            dry-run) ARGS+=(--dry-run) ;;
            upload)  if [ "$REPLACE" = "true" ]; then ARGS+=(--replace); fi ;;
          esac
          if [ "$SUBMIT" = "true" ]; then ARGS+=(--submit); fi

          python3 tools/asc_screenshots.py "${ARGS[@]}" "${SETS[@]}"
