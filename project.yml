name: TidbitsTrivia
options:
  bundleIdPrefix: com.learningischange
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top
configFiles:
  Debug: AppVersion.xcconfig
  Release: AppVersion.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Approachable concurrency: code is MainActor-isolated by default so
    # SwiftUI views and @Observable stores need no annotation; networking
    # and the corpus reader opt out with `nonisolated`. (Xcode 26+.)
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: L2G756LY8N
    CODE_SIGN_STYLE: Automatic
targets:
  TidbitsTrivia:
    type: application
    # Universal iOS + tvOS + macOS target (Decision 013, amended for macOS by
    # Decision 042). The tvOS slice ships its required layered App Icon + Top
    # Shelf via the "App Icon & Top Shelf Image.brandassets" set (resolves the
    # ITMS-90513 CFBundleIcons / TVTopShelfImage validation errors). Per-platform
    # UI is guarded by #if os(iOS) / #if os(tvOS) / #if os(macOS).
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: TidbitsTrivia
    # Game Center capability — the entitlement makes GameCenterManager.authenticate()
    # work; leaderboard IDs must be created in App Store Connect (owner step).
    # Automatic signing adds the capability to the App ID on first archive.
    entitlements:
      path: TidbitsTrivia/TidbitsTrivia.entitlements
      properties:
        com.apple.developer.game-center: true
        # Sign in with Apple MUST be declared here, not hand-added to the
        # .entitlements file — xcodegen REGENERATES that file from this block, so a
        # hand-edit is silently wiped on the next `xcodegen generate`. That is exactly
        # how it went missing before (commit ef27972 added it to the generated file;
        # the next regen dropped it, and the OS won't grant a runtime capability the
        # app's own compiled entitlements don't declare — tvOS could complete Apple's
        # sign-in UI but never persist a session). Same class as the macOS
        # settings-clobber ratchet: config lives in project.yml, never in generated output.
        com.apple.developer.applesignin: [Default]
    # Local StoreKit config so IAP purchases work in the simulator without App Store
    # Connect (the products still ship for real via App Store Connect at go-live).
    scheme:
      storeKitConfiguration: TidbitsTrivia/Resources/Tidbits.storekit
    # NOTE: an XCTest target hosting SKTestSession purchase tests
    # (TidbitsTriviaTests/ClubPurchaseTests.swift) is written and ready, but a hosted-
    # unit-test build under this Xcode-beta/XcodeGen combo hits a "Multiple commands produce
    # TidbitsTrivia.swiftmodule" collision (the app module builds twice). Needs a focused
    # config pass (likely: put the Core in a framework, or the app-as-host TEST_HOST wiring).
    # Deferred so the app stays clean-building; the test file is kept for that pass.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learningischange.tidbitstrivia
        PRODUCT_NAME: TidbitsTrivia
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION come ONLY from
        # AppVersion.xcconfig (the single source of truth). Target-level copies
        # here would SHADOW the xcconfig — every build silently stayed at 1(1).
        # TARGETED_DEVICE_FAMILY is derived from supportedDestinations
        # (iOS→1,2 + tvOS→3); setting it here would override tvOS and break it.
        # iOS uses the flat AppIcon.appiconset; tvOS needs the layered brand
        # asset (square appiconset is invalid on tvOS), so the icon name is
        # SDK-conditional.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]": "App Icon & Top Shelf Image"
        # The branded launch storyboard is iOS-only — tvOS rejects an iOS
        # launchScreen storyboard ("does not support target device type tv")
        # and macOS has no concept of a UIKit launch storyboard at all. Exclude
        # the file from both slices so the universal target still builds.
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=appletvos*]": "LaunchScreen.storyboard"
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=appletvsimulator*]": "LaunchScreen.storyboard"
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": "LaunchScreen.storyboard"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Mac App Store requires App Sandbox — a separate entitlements file
        # (TidbitsTrivia-macOS.entitlements) carries the sandbox + network-client +
        # user-selected-files scopes the Mac shell needs, PLUS Sign in with
        # Apple. The default TidbitsTrivia.entitlements (iOS/tvOS) carries
        # Game Center + Sign in with Apple (added 2026-07-27 — it was
        # Game-Center-only for a while after Sign in with Apple shipped on
        # iOS/tvOS, which is exactly why tvOS's flow could complete the Apple
        # ID UI but never actually persist a signed-in session: the OS won't
        # grant a runtime capability the app's own compiled entitlements
        # don't declare, even if the shared App ID supports it).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": "TidbitsTrivia/TidbitsTrivia-macOS.entitlements"
    info:
      # Explicit Info.plist (xcodegen fills the standard CFBundle* keys) so we
      # can ship a BRANDED launch screen via LaunchScreen.storyboard: coral
      # fills the screen, brand dots are strewn full-bleed (LaunchDots,
      # aspectFill), and the icon tile is centered (LaunchIcon) — the splash
      # reads as a zoomed-out app icon. A storyboard (not the minimal
      # UILaunchScreen dict) is required because that dict can't scatter
      # full-bleed dots — only a solid color + one centered image.
      path: TidbitsTrivia/Info.plist
      properties:
        CFBundleDisplayName: Tidbits
        # Bind the Info.plist version keys to the build-setting variables so they
        # resolve from AppVersion.xcconfig — without this xcodegen wrote literal
        # "1"/"1.0" into the plist, freezing every build at 1(1).
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Tidbits is a fixed "cream paper" design with NO dark-mode variants, so
        # force light everywhere — otherwise a dark-mode iPhone inverts default
        # text to white (white-on-cream) and system surfaces to dark
        # (dark-on-dark on Records). This is the single biggest legibility fix.
        UIUserInterfaceStyle: Light
        # Export compliance: Tidbits uses only standard HTTPS (Wikipedia API) —
        # exempt encryption. Declaring this skips the manual compliance question
        # on every TestFlight / App Store build.
        ITSAppUsesNonExemptEncryption: false
        # Mac App Store listing category — ignored (harmless) on iOS/tvOS.
        LSApplicationCategoryType: public.app-category.trivia-games
        # Phase-1 phone-as-buzzer (Decision 030): the TV advertises and phones
        # browse a room-code-PSK Bonjour service over the LAN. iOS 14+ shows the
        # local-network prompt on first use; tvOS needs the same declaration to
        # publish. Network.framework requires every Bonjour type be declared.
        NSLocalNetworkUsageDescription: "Tidbits uses your local network so phones in the room can act as buzzers for the TV — no internet required."
        NSBonjourServices:
          - "_tidbits-buzz._tcp"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
      configs:
        # Debug stays unsigned so simulator / CI builds need no team or certs.
        Debug:
          CODE_SIGNING_ALLOWED: NO
        # Release IS signed — a TestFlight/App Store archive requires it.
        # Automatic signing (set in base settings) picks the profile once
        # DEVELOPMENT_TEAM is filled in (see the OWNER checklist).
        Release:
          CODE_SIGNING_ALLOWED: YES
