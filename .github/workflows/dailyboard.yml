# The Daily's global board — the $0 layer that ranks everyone who played the Daily
# (docs/DAILY-BOARD-CONTRACT.md). Hourly: read per-day player results from RTDB (public
# read), rank the field, and commit static JSON to data/dailyboard/. Clients read the
# static file, never RTDB (R-NET-1). One RTDB read + at most one commit per hour — far
# under the Spark free tier (R-NET-2).
name: Aggregate Daily board

on:
  schedule:
    - cron: "34 * * * *"   # hourly at :34 (off both the top-of-hour and the :17 leaderboard cron)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dailyboard"
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate Daily board → static JSON
        # --corpus recomputes the authoritative qids with the same pickDaily every client
        # uses (proven byte-identical by tools/daily-parity/run.sh).
        run: python3 tools/aggregate_dailyboard.py --corpus assets/corpus.json

      # Publish the day's seven as ~4 KB of static JSON so the web stops paying 13 MB
      # to work out which seven they are. A three-day window because the cron is UTC
      # and a client's dayKey() is its LOCAL date.
      - name: Publish the Daily's questions
        run: python3 tools/publish_daily.py --corpus assets/corpus.json
      - name: Commit if changed (triggers the Pages deploy)
        run: |
          git config user.name "tidbits-dailyboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/dailyboard data/daily
          if git diff --cached --quiet; then
            echo "No Daily board change — nothing to commit."
          else
            git commit -m "dailyboard: refresh static JSON + the day's published questions"
            git pull --rebase --autostash origin main || true
            git push
          fi
