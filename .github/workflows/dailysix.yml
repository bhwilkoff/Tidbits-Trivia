# Daily Six — the $0 global daily competition (docs/DAILY-SIX-CONTRACT.md).
# Hourly: read per-day player results from RTDB (public read), rank the field, and commit
# static JSON to data/dailysix/. Clients read the static file, never RTDB (R-NET-1). One
# RTDB read + at most one commit per hour — far under the Spark free tier (R-NET-2).
name: Aggregate Daily Six

on:
  schedule:
    - cron: "34 * * * *"   # hourly at :34 (off both the top-of-hour and the :17 leaderboard cron)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dailysix"
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate Daily Six → static JSON
        # --corpus recomputes the authoritative qids with the same pickDaily every client
        # uses (proven byte-identical by tools/daily-parity/run.sh).
        run: python3 tools/aggregate_dailysix.py --corpus assets/corpus.json
      - name: Commit if changed (triggers the Pages deploy)
        run: |
          git config user.name "tidbits-dailysix-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/dailysix
          if git diff --cached --quiet; then
            echo "No Daily Six change — nothing to commit."
          else
            git commit -m "dailysix: refresh static JSON"
            git pull --rebase --autostash origin main || true
            git push
          fi
