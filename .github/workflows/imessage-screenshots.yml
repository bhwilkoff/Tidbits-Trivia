name: iMessage screenshots -> App Store Connect

# Uploads branding/store-screenshots/imessage-* to the editable iOS version.
#
# Runs here rather than on the dev Mac because the ASC issuer id is a repo secret and
# belongs in exactly one place. The screenshots themselves are committed, generated by
# tools/capture-imessage-screenshots.sh.

on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'Clear each set before uploading (otherwise a non-empty set is skipped)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      dry_run:
        description: 'List what would upload, change nothing'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: imessage-screenshots
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyjwt cryptography

      - name: Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          ARGS=""
          [ "${{ inputs.replace }}" = "true" ] && ARGS="$ARGS --replace"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 tools/asc_screenshots.py $ARGS \
            --set IMESSAGE_APP_IPHONE_67=branding/store-screenshots/imessage-iphone-6.9 \
            --set IMESSAGE_APP_IPAD_PRO_3GEN_129=branding/store-screenshots/imessage-ipad-13
